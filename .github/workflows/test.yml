name: Test

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run agent-run-trigger decision tests
        run: bash scripts/agent-run-trigger-decide.test.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Apply migrations against a throwaway DB
        run: npm run migrate -w apps/server
        env:
          DATABASE_URL: file:./data/ci.db
      - name: Test
        run: npm run test
